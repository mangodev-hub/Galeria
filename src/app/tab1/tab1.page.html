<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Galería de Fotos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Estado sin fotos -->
  @if (photoService.photos().length === 0) {
  <div class="empty-state">
    <ion-icon name="images-outline"></ion-icon>
    <p>Aún no hay fotos registradas.</p>
    <small>Toca el icono central de la cámara para capturar una foto.</small>
  </div>
  }

  <!-- Rejilla con las fotos tomadas -->
  @if (photoService.photos().length > 0) {
  <ion-grid>
    <ion-row>
      @for (photo of photoService.photos(); track photo.webviewPath) {
      <ion-col size="6" size-md="4" size-lg="3">
        <ion-card class="photo-card">
          <ion-img [src]="photo.webviewPath" alt="Foto capturada"></ion-img>
          <ion-card-content class="photo-info">
            <small>{{ photo.date | date:'shortTime' }}</small>
          </ion-card-content>
        </ion-card>
      </ion-col>
      }
    </ion-row>
  </ion-grid>
  }
</ion-content>
