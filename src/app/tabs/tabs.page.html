<ion-tabs>
  <ion-fab slot="fixed" vertical="bottom" horizontal="center" class="camera-fab">
    <ion-fab-button (click)="openCamera($event)" aria-label="Abrir cámara">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-tab-bar slot="bottom">
    <!-- Tab 1: Galería / Inicio -->
    <ion-tab-button tab="tab1">
      <ion-icon name="images-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <!-- Tab 2: Salir de la app -->
    <ion-tab-button (click)="confirmExit($event)">
      <ion-icon name="log-out-outline" color="danger"></ion-icon>
      <ion-label>Salir</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
